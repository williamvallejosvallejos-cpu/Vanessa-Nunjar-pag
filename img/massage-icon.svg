<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldM2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D48B"/>
      <stop offset="50%" stop-color="#C5A55A"/>
      <stop offset="100%" stop-color="#A68B3C"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>

  <!-- Central oil bottle -->
  <rect x="82" y="55" width="36" height="70" rx="6" fill="url(#goldM2)"/>
  <rect x="88" y="42" width="24" height="16" rx="4" fill="url(#goldM2)" opacity="0.9"/>
  <circle cx="100" cy="42" r="6" fill="url(#goldM2)" opacity="0.85"/>
  
  <!-- Oil level inside bottle -->
  <rect x="86" y="75" width="28" height="45" rx="4" fill="url(#oilGrad)" opacity="0.6"/>
  
  <!-- Label on bottle -->
  <rect x="88" y="65" width="24" height="20" rx="3" fill="#FFF8E1" opacity="0.8"/>
  <text x="100" y="79" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#C5A55A" font-weight="bold">OIL</text>

  <!-- Oil drops -->
  <g fill="url(#oilGrad)" opacity="0.7">
    <ellipse cx="100" cy="135" rx="4" ry="6"/>
    <ellipse cx="85" cy="140" rx="3" ry="5"/>
    <ellipse cx="115" cy="138" rx="3.5" ry="5.5"/>
  </g>

  <!-- Lavender/herbs left -->
  <g transform="translate(45,90)">
    <path d="M0,0 Q-8,-15 -3,-30 Q2,-15 0,0" fill="url(#leafG)" opacity="0.7"/>
    <path d="M5,-5 Q-3,-20 2,-35 Q7,-20 5,-5" fill="url(#leafG)" opacity="0.6"/>
    <path d="M10,-2 Q2,-17 7,-32 Q12,-17 10,-2" fill="url(#leafG)" opacity="0.5"/>
    <!-- Small flowers -->
    <circle cx="0" cy="-32" r="2.5" fill="#CE93D8" opacity="0.6"/>
    <circle cx="5" cy="-37" r="2.5" fill="#CE93D8" opacity="0.5"/>
    <circle cx="10" cy="-34" r="2" fill="#CE93D8" opacity="0.4"/>
  </g>

  <!-- Lavender/herbs right -->
  <g transform="translate(140,85)">
    <path d="M0,0 Q8,-15 3,-30 Q-2,-15 0,0" fill="url(#leafG)" opacity="0.7"/>
    <path d="M-5,-5 Q3,-20 -2,-35 Q-7,-20 -5,-5" fill="url(#leafG)" opacity="0.6"/>
    <path d="M-10,-2 Q-2,-17 -7,-32 Q-12,-17 -10,-2" fill="url(#leafG)" opacity="0.5"/>
    <circle cx="0" cy="-32" r="2.5" fill="#CE93D8" opacity="0.6"/>
    <circle cx="-5" cy="-37" r="2.5" fill="#CE93D8" opacity="0.5"/>
    <circle cx="-10" cy="-34" r="2" fill="#CE93D8" opacity="0.4"/>
  </g>

  <!-- Smooth stones at bottom -->
  <ellipse cx="85" cy="165" rx="18" ry="8" fill="#888" opacity="0.6"/>
  <ellipse cx="115" cy="162" rx="15" ry="7" fill="#777" opacity="0.6"/>
  <ellipse cx="100" cy="170" rx="12" ry="6" fill="#999" opacity="0.5"/>

  <!-- Sparkles -->
  <g fill="url(#goldM2)" opacity="0.4">
    <circle cx="30" cy="60" r="2"/>
    <circle cx="170" cy="55" r="2"/>
    <circle cx="35" cy="150" r="1.5"/>
    <circle cx="165" cy="145" r="1.5"/>
  </g>
</svg>