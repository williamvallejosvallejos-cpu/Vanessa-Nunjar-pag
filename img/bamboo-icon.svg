<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D48B"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#C5A55A"/>
      <stop offset="100%" stop-color="#A68B3C"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBF3D"/>
      <stop offset="100%" stop-color="#6B9A2E"/>
    </linearGradient>
  </defs>

  <!-- Bamboo stalk 1 -->
  <rect x="85" y="20" width="12" height="160" rx="6" fill="url(#bambooGrad)"/>
  <!-- Bamboo nodes -->
  <ellipse cx="91" cy="50" rx="10" ry="3" fill="#A68B3C"/>
  <ellipse cx="91" cy="90" rx="10" ry="3" fill="#A68B3C"/>
  <ellipse cx="91" cy="130" rx="10" ry="3" fill="#A68B3C"/>

  <!-- Bamboo stalk 2 (smaller, behind) -->
  <rect x="110" y="40" width="10" height="140" rx="5" fill="url(#bambooGrad)" opacity="0.7"/>
  <ellipse cx="115" cy="70" rx="8" ry="2.5" fill="#A68B3C" opacity="0.7"/>
  <ellipse cx="115" cy="110" rx="8" ry="2.5" fill="#A68B3C" opacity="0.7"/>

  <!-- Leaves -->
  <path d="M91,50 Q70,35 60,25 Q75,40 91,50" fill="url(#leafGrad)" opacity="0.9"/>
  <path d="M91,50 Q110,35 125,30 Q108,45 91,50" fill="url(#leafGrad)" opacity="0.8"/>
  <path d="M91,90 Q65,75 55,65 Q72,82 91,90" fill="url(#leafGrad)" opacity="0.85"/>
  <path d="M91,90 Q115,75 130,70 Q112,85 91,90" fill="url(#leafGrad)" opacity="0.75"/>
  <path d="M91,130 Q70,118 60,108 Q75,122 91,130" fill="url(#leafGrad)" opacity="0.8"/>
  <path d="M91,130 Q112,118 125,112 Q110,124 91,130" fill="url(#leafGrad)" opacity="0.7"/>
</svg>