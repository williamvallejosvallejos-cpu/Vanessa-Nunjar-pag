<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D48B"/>
      <stop offset="50%" stop-color="#C5A55A"/>
      <stop offset="100%" stop-color="#A68B3C"/>
    </linearGradient>
    <linearGradient id="plasmaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="50%" stop-color="#EF9A9A"/>
      <stop offset="100%" stop-color="#E57373"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
  </defs>

  <!-- Blood collection tube -->
  <rect x="75" y="30" width="22" height="70" rx="4" fill="url(#tubeGrad)" stroke="#90CAF9" stroke-width="1.5"/>
  <rect x="72" y="25" width="28" height="10" rx="3" fill="#E53935"/>
  
  <!-- Plasma separation in tube -->
  <rect x="78" y="60" width="16" height="35" rx="2" fill="url(#plasmaGrad)" opacity="0.8"/>
  <rect x="78" y="85" width="16" height="10" rx="2" fill="#B71C1C" opacity="0.6"/>
  
  <!-- Syringe -->
  <g transform="translate(105,55)">
    <rect x="0" y="0" width="12" height="50" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1"/>
    <rect x="2" y="5" width="8" height="20" rx="2" fill="url(#plasmaGrad)" opacity="0.7"/>
    <rect x="4" y="-8" width="4" height="12" rx="1" fill="#9E9E9E"/>
    <circle cx="6" cy="-10" r="4" fill="#9E9E9E"/>
    <!-- Needle -->
    <rect x="5" y="48" width="2" height="15" fill="#BDBDBD"/>
    <path d="M6,63 L4,70 L8,70 Z" fill="#BDBDBD"/>
  </g>

  <!-- Plasma drops/sparkles -->
  <g fill="url(#plasmaGrad)" opacity="0.6">
    <circle cx="55" cy="90" r="4"/>
    <circle cx="45" cy="105" r="3"/>
    <circle cx="150" cy="85" r="4"/>
    <circle cx="160" cy="100" r="3"/>
  </g>

  <!-- Energy/spark effect -->
  <g stroke="url(#goldP)" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M60,130 Q80,120 100,130 Q120,140 140,130"/>
    <path d="M50,145 Q75,135 100,145 Q125,155 150,145"/>
    <path d="M65,158 Q85,148 100,158 Q115,168 135,158"/>
  </g>

  <!-- Face silhouette for treatment area -->
  <ellipse cx="100" cy="120" rx="35" ry="25" fill="#F5E6D3" stroke="url(#goldP)" stroke-width="1" opacity="0.5"/>

  <!-- Sparkle accents -->
  <g fill="url(#goldP)" opacity="0.4">
    <circle cx="35" cy="50" r="2"/>
    <circle cx="165" cy="45" r="2"/>
    <circle cx="30" cy="130" r="1.5"/>
    <circle cx="170" cy="125" r="1.5"/>
  </g>

  <!-- PRP label -->
  <text x="100" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="url(#goldP)" font-weight="bold" letter-spacing="2">PRP</text>
</svg>