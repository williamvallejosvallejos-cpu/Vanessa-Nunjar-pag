<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D48B"/>
      <stop offset="50%" stop-color="#C5A55A"/>
      <stop offset="100%" stop-color="#A68B3C"/>
    </linearGradient>
    <linearGradient id="waxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="50%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#BDBDBD"/>
    </linearGradient>
  </defs>

  <!-- Wax pot -->
  <ellipse cx="100" cy="140" rx="40" ry="12" fill="url(#potGrad)" stroke="#999" stroke-width="1"/>
  <rect x="60" y="100" width="80" height="40" rx="5" fill="url(#potGrad)" stroke="#999" stroke-width="1"/>
  <ellipse cx="100" cy="100" rx="40" ry="12" fill="url(#potGrad)" stroke="#999" stroke-width="1"/>
  
  <!-- Wax inside pot -->
  <ellipse cx="100" cy="102" rx="35" ry="9" fill="url(#waxGrad)"/>
  
  <!-- Handle -->
  <path d="M60,115 Q40,115 40,100 Q40,85 60,85" fill="none" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <path d="M140,115 Q160,115 160,100 Q160,85 140,85" fill="none" stroke="#888" stroke-width="3" stroke-linecap="round"/>

  <!-- Wax applicator/spatula -->
  <rect x="96" y="50" width="8" height="55" rx="2" fill="#DEB887" stroke="#C5A55A" stroke-width="0.8"/>
  <ellipse cx="100" cy="50" rx="12" ry="6" fill="url(#waxGrad)" stroke="#C5A55A" stroke-width="0.8"/>
  
  <!-- Wax drip -->
  <path d="M100,56 Q102,65 100,75 Q98,65 100,56" fill="url(#waxGrad)" opacity="0.7"/>

  <!-- Wax strips (paper/cloth) -->
  <rect x="130" y="70" width="35" height="50" rx="3" fill="#FFF8E1" stroke="url(#goldW)" stroke-width="1" transform="rotate(10,147,95)"/>
  <rect x="135" y="75" width="28" height="40" rx="2" fill="#FFF3E0" transform="rotate(10,149,95)"/>
  
  <!-- Used strip with wax -->
  <rect x="35" y="75" width="30" height="45" rx="3" fill="#FFF8E1" stroke="url(#goldW)" stroke-width="1" transform="rotate(-8,50,97)"/>
  <ellipse cx="50" cy="88" rx="10" ry="15" fill="url(#waxGrad)" opacity="0.4" transform="rotate(-8,50,88)"/>

  <!-- Sparkle accents -->
  <g fill="url(#goldW)" opacity="0.4">
    <path d="M165,55 L167,50 L169,55 L174,57 L169,59 L167,64 L165,59 L160,57 Z"/>
    <path d="M25,60 L27,55 L29,60 L34,62 L29,64 L27,69 L25,64 L20,62 Z"/>
    <circle cx="170" cy="130" r="2"/>
    <circle cx="30" cy="135" r="2"/>
  </g>

  <!-- Temperature indicator -->
  <text x="100" y="125" text-anchor="middle" font-family="Arial" font-size="8" fill="#C5A55A" opacity="0.6">38°</text>
</svg>