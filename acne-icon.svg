<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D48B"/>
      <stop offset="50%" stop-color="#C5A55A"/>
      <stop offset="100%" stop-color="#A68B3C"/>
    </linearGradient>
    <linearGradient id="serum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
  </defs>

  <!-- Face silhouette (front view, clean) -->
  <ellipse cx="100" cy="95" rx="42" ry="52" fill="#F5E6D3" stroke="url(#goldT)" stroke-width="1.5"/>

  <!-- Hair outline -->
  <path d="M58,70 Q58,35 100,30 Q142,35 142,70" fill="url(#goldT)" opacity="0.85"/>
  <ellipse cx="100" cy="68" rx="44" ry="10" fill="url(#goldT)"/>

  <!-- Closed eyes (relaxed) -->
  <path d="M80,85 Q85,82 90,85" fill="none" stroke="#8B7355" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M110,85 Q115,82 120,85" fill="none" stroke="#8B7355" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M77,76 Q85,73 92,76" fill="none" stroke="#8B7355" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M108,76 Q115,73 122,76" fill="none" stroke="#8B7355" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M100,90 Q97,98 100,103 Q103,98 100,90" fill="#D4B896" opacity="0.4"/>

  <!-- Lips -->
  <path d="M92,113 Q100,118 108,113" fill="#E8A0A0" opacity="0.5"/>

  <!-- Treatment serum drops on face -->
  <g fill="url(#serum)" opacity="0.6">
    <circle cx="78" cy="75" r="3"/>
    <circle cx="122" cy="75" r="3"/>
    <circle cx="100" cy="70" r="2.5"/>
  </g>

  <!-- Target/spot treatment markers -->
  <g stroke="url(#goldT)" stroke-width="1.2" fill="none" opacity="0.6">
    <circle cx="78" cy="95" r="6"/>
    <circle cx="122" cy="95" r="6"/>
    <circle cx="100" cy="100" r="5"/>
  </g>

  <!-- Treatment bottle -->
  <g transform="translate(160,60)">
    <rect x="0" y="10" width="12" height="30" rx="3" fill="url(#bottle)"/>
    <rect x="2" y="2" width="8" height="10" rx="2" fill="url(#bottle)" opacity="0.9"/>
    <circle cx="6" cy="2" r="2.5" fill="url(#bottle)" opacity="0.8"/>
    <!-- Dropper tip -->
    <path d="M6,12 L6,18" stroke="#BA68C8" stroke-width="1.5"/>
    <circle cx="6" cy="18" r="1.5" fill="url(#serum)"/>
  </g>

  <!-- Sparkle/shine accents -->
  <g fill="url(#goldT)" opacity="0.5">
    <path d="M30,55 L32,50 L34,55 L39,57 L34,59 L32,64 L30,59 L25,57 Z"/>
    <path d="M165,120 L167,115 L169,120 L174,122 L169,124 L167,129 L165,124 L160,122 Z"/>
    <circle cx="35" cy="120" r="1.5"/>
    <circle cx="165" cy="50" r="1.5"/>
  </g>

  <!-- Clean/pure indicator -->
  <path d="M100,155 L103,162 L110,162 L105,167 L107,174 L100,170 L93,174 L95,167 L90,162 L97,162 Z" fill="url(#goldT)" opacity="0.4"/>
</svg>