<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="50%" stop-color="#E8D5C0"/>
      <stop offset="100%" stop-color="#D4C0A8"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D48B"/>
      <stop offset="50%" stop-color="#C5A55A"/>
      <stop offset="100%" stop-color="#A68B3C"/>
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="50%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
  </defs>

  <!-- Face outline -->
  <ellipse cx="100" cy="95" rx="48" ry="58" fill="url(#faceGrad)" stroke="#C5A55A" stroke-width="1.5"/>

  <!-- Hair/headband -->
  <path d="M52,70 Q52,30 100,28 Q148,30 148,70" fill="url(#goldAcc)" opacity="0.9"/>
  <ellipse cx="100" cy="68" rx="50" ry="12" fill="url(#goldAcc)"/>

  <!-- Face mask (green treatment mask) -->
  <ellipse cx="100" cy="90" rx="38" ry="42" fill="url(#maskGrad)" opacity="0.7"/>
  
  <!-- Eyes (closed/relaxed) -->
  <path d="M78,85 Q82,82 86,85" fill="none" stroke="#8B7355" stroke-width="2" stroke-linecap="round"/>
  <path d="M114,85 Q118,82 122,85" fill="none" stroke="#8B7355" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M75,76 Q82,73 89,76" fill="none" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M111,76 Q118,73 125,76" fill="none" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M100,92 Q97,100 100,105 Q103,100 100,92" fill="#D4B896" opacity="0.5"/>

  <!-- Lips -->
  <path d="M92,115 Q100,120 108,115" fill="#E8A0A0" opacity="0.6"/>
  <path d="M92,115 Q100,112 108,115" fill="#D49090" opacity="0.5"/>

  <!-- Cucumber slices on eyes -->
  <circle cx="82" cy="85" r="8" fill="#81C784" opacity="0.8"/>
  <circle cx="82" cy="85" r="5" fill="#A5D6A7"/>
  <circle cx="82" cy="85" r="2" fill="#66BB6A" opacity="0.6"/>
  
  <circle cx="118" cy="85" r="8" fill="#81C784" opacity="0.8"/>
  <circle cx="118" cy="85" r="5" fill="#A5D6A7"/>
  <circle cx="118" cy="85" r="2" fill="#66BB6A" opacity="0.6"/>

  <!-- Treatment droplets/sparkles -->
  <g fill="url(#sparkleGrad)" opacity="0.8">
    <path d="M55,60 L57,55 L59,60 L57,65 Z"/>
    <path d="M141,60 L143,55 L145,60 L143,65 Z"/>
    <path d="M45,95 L47,90 L49,95 L47,100 Z"/>
    <path d="M151,95 L153,90 L155,95 L153,100 Z"/>
  </g>

  <!-- Sparkle stars -->
  <g fill="#FFF" opacity="0.6">
    <path d="M50,50 L52,46 L54,50 L58,52 L54,54 L52,58 L50,54 L46,52 Z"/>
    <path d="M146,45 L148,41 L150,45 L154,47 L150,49 L148,53 L146,49 L142,47 Z"/>
    <path d="M40,120 L42,116 L44,120 L48,122 L44,124 L42,128 L40,124 L36,122 Z"/>
    <path d="M156,115 L158,111 L160,115 L164,117 L160,119 L158,123 L156,119 L152,117 Z"/>
  </g>

  <!-- Gold decorative dots at bottom -->
  <circle cx="80" cy="155" r="3" fill="url(#goldAcc)" opacity="0.5"/>
  <circle cx="100" cy="160" r="3" fill="url(#goldAcc)" opacity="0.6"/>
  <circle cx="120" cy="155" r="3" fill="url(#goldAcc)" opacity="0.5"/>
</svg>