<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="machineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="30%" stop-color="#D0D0D0"/>
      <stop offset="70%" stop-color="#B8B8B8"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D48B"/>
      <stop offset="50%" stop-color="#C5A55A"/>
      <stop offset="100%" stop-color="#A68B3C"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF6666" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8888" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main machine body -->
  <rect x="55" y="50" width="90" height="110" rx="8" fill="url(#machineGrad)" stroke="#999" stroke-width="1"/>
  
  <!-- Gold accent line -->
  <rect x="55" y="75" width="90" height="3" fill="url(#goldAcc)"/>
  
  <!-- Screen -->
  <rect x="68" y="58" width="64" height="30" rx="4" fill="url(#screenGrad)"/>
  <!-- Screen content -->
  <circle cx="100" cy="73" r="8" fill="none" stroke="#4ECDC4" stroke-width="1.5" opacity="0.8"/>
  <text x="100" y="77" text-anchor="middle" font-family="Arial" font-size="10" fill="#4ECDC4" font-weight="bold">ON</text>
  <!-- Screen status dots -->
  <circle cx="78" cy="82" r="2" fill="#4ECDC4" opacity="0.6"/>
  <circle cx="85" cy="82" r="2" fill="#C5A55A" opacity="0.6"/>
  <circle cx="92" cy="82" r="2" fill="#FF6B6B" opacity="0.6"/>

  <!-- Control buttons -->
  <circle cx="75" cy="100" r="4" fill="#C5A55A" opacity="0.8"/>
  <circle cx="88" cy="100" r="4" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="101" cy="100" r="4" fill="#FF6B6B" opacity="0.8"/>
  
  <!-- Keypad -->
  <rect x="115" y="92" width="20" height="28" rx="3" fill="#2a2a2a"/>
  <circle cx="120" cy="97" r="1.5" fill="#555"/>
  <circle cx="125" cy="97" r="1.5" fill="#555"/>
  <circle cx="130" cy="97" r="1.5" fill="#555"/>
  <circle cx="120" cy="103" r="1.5" fill="#555"/>
  <circle cx="125" cy="103" r="1.5" fill="#555"/>
  <circle cx="130" cy="103" r="1.5" fill="#555"/>
  <circle cx="120" cy="109" r="1.5" fill="#555"/>
  <circle cx="125" cy="109" r="1.5" fill="#555"/>
  <circle cx="130" cy="109" r="1.5" fill="#555"/>

  <!-- Gold brand strip -->
  <rect x="60" y="125" width="80" height="18" rx="4" fill="url(#goldAcc)"/>

  <!-- Wheels/base -->
  <circle cx="70" cy="162" r="6" fill="#666"/>
  <circle cx="70" cy="162" r="3" fill="#888"/>
  <circle cx="130" cy="162" r="6" fill="#666"/>
  <circle cx="130" cy="162" r="3" fill="#888"/>

  <!-- Handpiece -->
  <rect x="148" y="95" width="45" height="18" rx="9" fill="url(#machineGrad)" stroke="#999" stroke-width="0.8"/>
  <rect x="148" y="99" width="45" height="3" fill="url(#goldAcc)" opacity="0.6"/>
  <circle cx="190" cy="104" r="6" fill="#2a2a2a"/>
  <circle cx="190" cy="104" r="4" fill="#1a1a1a"/>
  
  <!-- Laser beam from handpiece -->
  <path d="M184,104 L188,130 L192,104 Z" fill="url(#laserBeam)" filter="url(#glow)" opacity="0.7"/>
  
  <!-- Cable -->
  <path d="M148,104 Q130,104 145,95" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
</svg>